                                    <span class="status-icon"><?= $is_completed ? '✔' : '○'; ?></span>

                                    <?php if (!empty($lesson['materials'])): ?>

                                            <strong>Matériel:</strong>
                                            <?php foreach ($lesson['materials'] as $material): ?>

                                        </div>

                                <div class="lesson-actions">
                                    <?php if ($is_completed): ?>
                                        <span class="btn btn-disabled">Terminé</span>

                                        <?php else: ?>
                                            <form action="/student/lesson/complete/<?= $lesson['id'] ?>" method="POST" style="display: inline;">
