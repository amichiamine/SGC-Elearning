<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.content-type-select').forEach(select => {
        select.addEventListener('change', function() {
            const form = this.closest('form');
            const liveSessionFields = form.querySelector('.live-session-fields');
            if (this.value === 'live_session') {
                liveSessionFields.style.display = 'block';
            } else {
                liveSessionFields.style.display = 'none';
            }
        });
    });
});
</script>
