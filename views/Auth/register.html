    <!-- JavaScript -->
    <script>
        // Fonction pour afficher/masquer le mot de passe
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const toggle = input.nextElementSibling.nextElementSibling;
            
            if (input.type === 'password') {
                input.type = 'text';
                toggle.innerHTML = '<i class="icon-eye-off">🙈</i>';
            } else {
                input.type = 'password';
                toggle.innerHTML = '<i class="icon-eye">👁</i>';
            }
        }

        // Vérification de la force du mot de passe
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength');
            let strength = 0;
            let feedback = '';

            if (password.length >= 6) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;

            switch(strength) {
                case 0:
                case 1:
                    feedback = 'Très faible';
                    strengthDiv.className = 'password-strength weak';
                    break;
                case 2:
                    feedback = 'Faible';
                    strengthDiv.className = 'password-strength weak';
                    break;
                case 3:
                    feedback = 'Moyen';
                    strengthDiv.className = 'password-strength medium';
                    break;
                case 4:
                    feedback = 'Fort';
                    strengthDiv.className = 'password-strength strong';
                    break;
                case 5:
                    feedback = 'Très fort';
                    strengthDiv.className = 'password-strength very-strong';
                    break;
            }

            strengthDiv.textContent = password ? feedback : '';
        });

        // Validation en temps réel de la confirmation de mot de passe
        document.getElementById('password_confirm').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            
            if (confirmPassword && password !== confirmPassword) {
                this.setCustomValidity('Les mots de passe ne correspondent pas');
            } else {
                this.setCustomValidity('');
            }
        });

        // Validation côté client
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;
            const terms = document.querySelector('input[name="terms"]').checked;

            if (!username || username.length < 3) {
                e.preventDefault();
                alert('Le nom d\'utilisateur doit contenir au moins 3 caractères.');
                return;
            }

            if (!email || !email.includes('@')) {
                e.preventDefault();
                alert('Veuillez entrer un email valide.');
                return;
            }

            if (!password || password.length < 6) {
                e.preventDefault();
                alert('Le mot de passe doit contenir au moins 6 caractères.');
                return;
            }

            if (password !== passwordConfirm) {
                e.preventDefault();
                alert('Les mots de passe ne correspondent pas.');
                return;
            }

            if (!terms) {
                e.preventDefault();
                alert('Vous devez accepter les conditions d\'utilisation.');
                return;
            }
        });
        
        // Animation d'entrée
        document.addEventListener('DOMContentLoaded', function() {
            const card = document.querySelector('.auth-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(30px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.6s ease-out';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
