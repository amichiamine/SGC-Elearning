<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><?php echo htmlspecialchars($title ?? 'Connexion - SGC E-Learning'); ?></title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="<?php echo THEME_URL; ?>/css/claymorphism.css">
    <link rel="stylesheet" href="<?php echo THEME_URL; ?>/css/auth.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="<?php echo ASSETS_URL; ?>/images/favicon.png">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-header">
                <div class="auth-logo">
                    <h2>SGC</h2>
                    <span>E-Learning</span>
                </div>
                <h1>Connexion</h1>
                <p>Accédez à votre espace d'apprentissage</p>
            </div>

            <!-- Messages d'erreur -->
            <?php if (isset($error) && $error): ?>
                <div class="alert alert-error">
                    <i class="icon-error">⚠</i>
                    <?php echo htmlspecialchars($error); ?>
                </div>
            <?php endif; ?>

            <!-- Formulaire de connexion -->
            <form method="POST" action="" class="auth-form">
                <input type="hidden" name="csrf_token" value="<?php echo htmlspecialchars($csrf_token); ?>">
                
                <div class="form-group">
                    <label for="username">Nom d'utilisateur ou Email</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        value="<?php echo htmlspecialchars($old_input['username'] ?? ''); ?>"
                        placeholder="Entrez votre nom d'utilisateur ou email"
                        required 
                        autofocus
                    >
                    <i class="input-icon">👤</i>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Entrez votre mot de passe"
                        required
                    >
                    <i class="input-icon">🔒</i>
                    <button type="button" class="password-toggle" onclick="togglePassword('password')">
                        <i class="icon-eye">👁</i>
                    </button>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember_me" value="1">
                        <span class="checkmark"></span>
                        Se souvenir de moi
                    </label>
                    
                    <a href="<?php echo WEB_ROOT; ?>/forgot-password" class="forgot-link">
                        Mot de passe oublié ?
                    </a>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    <i class="icon-login">🔓</i>
                    Se connecter
                </button>
            </form>

            <!-- Lien vers inscription -->
            <div class="auth-footer">
                <p>Pas encore de compte ?</p>
                <a href="<?php echo WEB_ROOT; ?>/register" class="btn btn-outline">
                    <i class="icon-user-plus">➕</i>
                    Créer un compte
                </a>
            </div>

            <!-- Retour à l'accueil -->
            <div class="auth-back">
                <a href="<?php echo WEB_ROOT; ?>" class="back-link">
                    <i class="icon-arrow-left">←</i>
                    Retour à l'accueil
                </a>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Fonction pour afficher/masquer le mot de passe
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const toggle = input.nextElementSibling.nextElementSibling;
            
            if (input.type === 'password') {
                input.type = 'text';
                toggle.innerHTML = '<i class="icon-eye-off">🙈</i>';
            } else {
                input.type = 'password';
                toggle.innerHTML = '<i class="icon-eye">👁</i>';
            }
        }

        // Validation côté client
        document.querySelector('.auth-form').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username) {
                e.preventDefault();
                alert('Veuillez entrer votre nom d\'utilisateur ou email.');
                return;
            }

            if (!password) {
                e.preventDefault();
                alert('Veuillez entrer votre mot de passe.');
                return;
            }

            if (password.length < 6) {
                e.preventDefault();
                alert('Le mot de passe doit contenir au moins 6 caractères.');
                return;
            }
        });
        
        // Animation d'entrée
        document.addEventListener('DOMContentLoaded', function() {
            const card = document.querySelector('.auth-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(30px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.6s ease-out';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
